summary: >-
  A doodle-based cycling jersey that captures the entire cycling culture of
  Kolkata, every popular ride point, tea break, breakfast stop, u-turn, and race
  landmark mapped into a single wearable love letter to the City of Joy. The
  brief was simple and impossible in equal measure: make something that has
  never been made before, and make something every Kolkata cyclist would love to
  wear.
challenge: >-
  Kolkata has one of the most passionate and tightly knit urban cycling
  communities in India. They ride the same routes, stop at the same chai stalls,
  argue about the same u-turns, and share a collective memory of the city that
  outsiders simply do not have access to. A jersey for this community could not
  be generic. It could not be pretty without being personal. It had to earn its
  place on the back of someone who has pedalled through a Kolkata morning at
  5am, knows exactly which breakfast spot hits differently after 40 kilometres,
  and has a strong opinion about every popular meeting point on the circuit. The
  challenge was not just design, it was cultural accuracy at the level of
  someone who lives it.
insight: >-
  Kolkata's cyclists have not just ridden through the city. They have claimed
  it. Corner by corner, adda by adda, stop by stop. The routes are not roads,
  they are rituals. The tea break is not a pause, it is a social institution.
  The u-turn is not a directional instruction,  it is a landmark with its own
  personality and history. What this community shares is not a sport. It is a
  shared geography of experience, built up over thousands of early mornings and
  countless kilometres. A jersey that captured that would not need to explain
  itself to anyone who has ever pedalled through Kolkata. They would simply look
  at it and see themselves.
approach: >-
  Translated the entire lived experience of cycling in Kolkata into a continuous
  doodle illustration system that wraps the full jersey, front, back, and
  sleeves, as a single unbroken visual world. Every significant touchpoint in
  the Kolkata cycling calendar was mapped and illustrated: popular ride points,
  chai and breakfast stops, community meeting spots, u-turns, race start and
  finish locations. Each was rendered in doodle art and woven together with the
  broader cultural fabric of the city, its street food, its colonial and local
  architecture, its cinema hoardings, its Durga Puja pandals, its trams, its
  chaos, its warmth, its colour. Nothing was included for decoration. Every
  element was chosen because a Kolkata cyclist would stop mid-sentence, point at
  it, and say,  I've been there. The illustration does not depict Kolkata from
  the outside. It depicts Kolkata from the saddle, the version of the city that
  only its cycling community truly knows.
outcome: >-
  A jersey that functions as cultural documentation as much as sportswear. The
  City of Joy on two wheels, worn by the people who know every inch of it. For
  the Kolkata cycling community, it is instant recognition, a piece that holds
  their entire shared world in a single garment. For everyone else, it is an
  invitation to understand what it means to truly belong to a city. The brief
  asked for something that had never been made before. The result is a wearable
  love letter that could only ever have been made for Kolkata, and only ever
  truly understood by the people who ride it.
